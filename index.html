<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Flow - LocalStorage + Fresh UI</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
    body { background:#f0f4fa; color:#1a1e2b; overflow:hidden; }

    /* top navigation — vibrant purple to blue gradient */
    .topnav {
      position:fixed; top:0; left:0; right:0; height:64px;
      background:linear-gradient(145deg, #5f2b6e, #2b4f8c);
      border-bottom:1px solid #7a56a0;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 1.2rem; box-shadow:0 4px 14px rgba(35, 20, 60, 0.35); z-index:100;
    }
    .topnav .categories {
      display:flex; gap:0.4rem; overflow-x:auto; padding:0.2rem 0;
    }
    .topnav button {
      padding:0.45rem 1.3rem; font-size:0.9rem; font-weight:600;
      color:#f0dcff; background:rgba(255,255,255,0.08); border:none; border-radius:40px;
      cursor:pointer; white-space:nowrap; backdrop-filter:blur(6px);
      transition:0.12s; letter-spacing:0.2px; border:1px solid rgba(255,255,255,0.15);
    }
    .topnav button:hover { background:rgba(220, 180, 255, 0.3); color:white; }
    .topnav button.active { 
      background:linear-gradient(125deg, #c667e0, #7a5dc9); 
      color:white; box-shadow:0 4px 12px #5a3a9e; border-color:#e5baff;
    }
    .top-add-btn {
      width:40px; height:40px; font-size:1.8rem;
      background:rgba(255,255,255,0.15); border-radius:50%; color:#f0dcff;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; border:1px solid #c27ee6; backdrop-filter:blur(6px);
      transition:0.1s; margin-left:0.8rem;
    }
    .top-add-btn:hover { background:#a65fd4; color:white; transform:scale(1.1); border-color:white; }
    
    /* sidebar width 80px — rich purple */
    .sidebar {
      position:fixed; top:64px; left:0; width:80px; height:calc(100vh - 64px);
      background:#2a1f3c; border-right:1px solid #68558b;
      overflow-y:auto; padding:1rem 0.2rem; text-align:center;
      box-shadow:4px 0 18px rgba(20, 10, 30, 0.4);
    }
    .sidebar h4 {
      font-size:0.7rem; color:#dbbfff; margin:0.7rem 0 0.8rem;
      font-weight:800; text-transform:uppercase; letter-spacing:0.8px;
      background:rgba(170, 130, 230, 0.2); padding:0.3rem 0; border-radius:16px;
    }
    .sidebar button {
      width:100%; padding:0.5rem 0.1rem; margin:0.2rem 0;
      background:#382b50; border:none; border-radius:14px;
      font-size:0.68rem; font-weight:500; text-align:center; word-break:break-word;
      cursor:pointer; transition:0.1s; line-height:1.2; color:#e4d0ff; border:1px solid #6c4f96;
    }
    .sidebar button:hover { background:#54407c; color:white; border-color:#dbb5ff; transform:translateY(-1px); }
    .sidebar button.active { 
      background:linear-gradient(145deg, #b268e0, #7346b0); 
      color:white; font-weight:700; border-color:#f0d0ff; box-shadow:0 4px 10px #5b3a86;
    }

    /* content — LEFT/RIGHT GAP REDUCED to 5px (minimum) */
    .content {
      margin-left:80px; margin-top:64px; 
      padding:2rem 5px 6rem 5px;
      height:calc(100vh - 64px); overflow-y:auto; 
      background:#f8f6ff;
    }
    .content-wrapper {
      max-width:100%; 
      padding:0 2px;
    }

    /* headings */
    .content h2 { 
      font-size:2.2rem; font-weight:720; margin:0 0 1.8rem 0; 
      background:linear-gradient(148deg, #4a2f7c, #7e4fa3); 
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text; border-left:6px solid #9f67cf; padding-left:1rem;
      letter-spacing:-0.01em;
    }

    /* DIRECT Q&A — minimal styling */
    .qa-block {
      margin-bottom:1.8rem;
      padding:0.2rem 0 0.2rem 0.6rem;
      border-left:3px solid #b072db;
    }
    .qa-block .question {
      font-weight:700; font-size:1.4rem; margin-bottom:0.3rem;
      color:#1f2645; letter-spacing:-0.01rem;
    }
    .qa-block .question span {
      color:#8f5fc7; font-weight:800; margin-right:0.5rem;
    }
    .qa-block .answer {
      line-height:1.6; color:#262d42; white-space:pre-line; font-weight:400;
      font-size:1.15rem; padding-left:0.2rem;
    }
    .qa-block .answer span {
      color:#a050a0; font-weight:700; margin-right:0.5rem;
    }

    /* fixed edit button — vibrant purple */
    .fixed-edit-btn {
      position:fixed; bottom:22px; right:22px;
      width:50px; height:50px; border-radius:50%;
      background:linear-gradient(142deg, #b45bd4, #6b3f9e);
      color:white; font-size:1.9rem; font-weight:300;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 12px 24px rgba(70, 30, 100, 0.6), 0 0 0 4px rgba(255, 255, 255, 0.4);
      cursor:pointer; border:none; transition:0.1s;
    }
    .fixed-edit-btn:hover { transform:scale(1.18) rotate(4deg); background:#c971e6; }

    /* popup styles — fresh */
    .popup {
      display:none; position:fixed; inset:0;
      background:rgba(20, 12, 36, 0.75); backdrop-filter:blur(8px);
      justify-content:center; align-items:center; z-index:300;
    }
    .popup-content {
      background:white; width:90%; max-width:820px; border-radius:40px;
      padding:2rem 2.2rem; max-height:90vh; overflow-y:auto;
      box-shadow:0 40px 60px #1f1335; border:1px solid #cbb2e9;
    }
    .popup label { 
      display:block; margin:0.8rem 0 0.3rem; font-weight:600; 
      color:#492e6d; font-size:1rem;
    }
    .popup input, .popup textarea {
      width:100%; padding:0.9rem 1.2rem; margin-bottom:1rem;
      border:2px solid #dcc9f5; border-radius:24px; font-size:1rem;
      background:#fdfbff;
    }
    .popup input:focus, .popup textarea:focus { border-color:#b07fe0; outline:none; }
    .popup button {
      width:100%; padding:1rem; background:linear-gradient(145deg, #9855b9, #633e92);
      color:white; border:none; border-radius:40px; font-weight:700; font-size:1rem;
      cursor:pointer; box-shadow:0 8px 18px #b89bdd;
    }
    .popup button:hover { filter:brightness(1.1); }
    .close { float:right; font-size:2.6rem; cursor:pointer; color:#a279c6; line-height:0.8; }
    .close:hover { color:#5b3892; }
    .popup hr { margin:1.8rem 0; border:2px solid #eddaff; }

    .edit-item {
      background:#f2ebff; border-radius:28px; padding:1.5rem; margin-bottom:1.8rem;
      border:1px solid #d7baf5;
    }
    .edit-item input, .edit-item textarea { background:white; border-radius:18px; }
    .edit-item-actions { display:flex; gap:0.8rem; justify-content:flex-end; margin-top:0.8rem; }
    .edit-item-actions button { padding:0.5rem 1.5rem; width:auto; background:#d9554a; border-radius:40px; }
    .edit-item-actions button.save-edit { background:#1f9f7a; }
  </style>
</head>
<body>

<!-- topnav with plus — fresh vibrant colors -->
<div class="topnav">
  <div class="categories">
    <button data-category="html" class="active" onclick="loadCategory('html')">HTML</button>
    <button data-category="css" onclick="loadCategory('css')">CSS</button>
    <button data-category="js" onclick="loadCategory('js')">JS</button>
    <button data-category="node" onclick="loadCategory('node')">Node</button>
    <button data-category="express" onclick="loadCategory('express')">Express</button>
    <button data-category="mongodb" onclick="loadCategory('mongodb')">MongoDB</button>
    <button data-category="react" onclick="loadCategory('react')">React</button>
  </div>
  <div class="top-add-btn" onclick="openPopup(false)" title="Add new question">+</div>
</div>

<!-- sidebar 80px -->
<div class="sidebar" id="sidebar"></div>

<!-- main content — MINIMAL GAP (5px left/right) -->
<div class="content" id="content"></div>

<!-- bottom edit button -->
<div class="fixed-edit-btn" onclick="openGlobalEdit()" title="Edit / bulk add / delete">✎</div>

<!-- popup for adding -->
<div class="popup" id="popup">
  <div class="popup-content">
    <span class="close" onclick="closePopup()">×</span>
    <h3 id="popupTitle">➕ Add Question</h3>
    <div id="topicSection">
      <label>Topic / Short Name</label>
      <input type="text" id="topicName" placeholder="e.g. closures, flexbox" maxlength="30">
    </div>
    <label>Question</label>
    <textarea id="question" placeholder="Enter question..."></textarea>
    <label>Answer</label>
    <textarea id="answer" placeholder="Enter answer..."></textarea>
    <button onclick="saveItem()">💾 Save Question</button>
    <hr>
    <label>📥 Import JSON</label>
    <textarea id="jsonPaste" rows="4" placeholder='[{"topicName":"useEffect","question":"...?","answer":"..."}]'></textarea>
    <button onclick="importJSON()">⬆️ Import</button>
  </div>
</div>

<!-- global edit popup -->
<div class="popup" id="editPopup">
  <div class="popup-content">
    <span class="close" onclick="closeEditPopup()">×</span>
    <h3 style="color:#4a2f7c;">✏️ Edit Topic: <span id="editTopicName" style="color:#8f5fc7;"></span></h3>
    <div id="editItemsContainer"></div>
    <button onclick="saveAllEdits()" style="background:linear-gradient(145deg, #1f9f7a, #157a5d); margin-top:1.8rem;">✔️ Done / Save Changes</button>
  </div>
</div>

<script>
  const categories = ['html','css','js','node','express','mongodb','react'];
  let data = {};
  let currentCategory = 'html';
  let currentTopic = null;
  let isQuickMode = false;

  // localStorage key
  const STORAGE_KEY = 'interviewFlowData';

  // Load data from localStorage or initialize with defaults
  function loadDataFromStorage() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      try {
        data = JSON.parse(stored);
        // Ensure all categories exist
        categories.forEach(cat => { if (!data[cat]) data[cat] = {}; });
      } catch (e) {
        console.warn('Failed to parse stored data, using defaults.');
        initDefaultData();
      }
    } else {
      initDefaultData();
    }
    saveDataToStorage(); // ensure fresh save
  }

  // Default demo data
  function initDefaultData() {
    data = {
      html: {
        "doctype": [{q:"What is DOCTYPE?", a:"Declares document type & version to browser"}],
        "link-tag": [{q:"What is <link> tag used for?", a:"To link external CSS, favicon, etc."}],
        "meta-tags": [{q:"Common meta tags?", a:"charset, viewport, description, keywords"}],
        "semantic": [{q:"Semantic elements?", a:"header, nav, main, article, section, footer"}],
        "forms": [{q:"What is <form> method GET vs POST?", a:"GET: url params, POST: body (secure)"}],
      },
      css: {
        "flexbox": [{q:"Center with flex?", a:"display:flex; justify-content:center; align-items:center;"}],
        "grid": [{q:"CSS Grid basic?", a:"display:grid; grid-template-columns: repeat(3, 1fr);"}],
        "position": [{q:"position: absolute vs relative?", a:"relative: to itself; absolute: to nearest positioned ancestor"}],
      },
      js: {
        "closures": [{q:"What is closure?", a:"Function + access to outer scope variables"}],
        "promises": [{q:"Promise states?", a:"pending, fulfilled, rejected"}],
        "async-await": [{q:"Async/await vs .then?", a:"Syntactic sugar over promises"}],
      },
      node: {
        "event-loop": [{q:"Node event loop phases?", a:"timers, pending, poll, check, close"}],
        "modules": [{q:"require vs import?", a:"CommonJS vs ES"}],
      },
      express: {
        "middleware": [{q:"What is middleware?", a:"Functions that have access to req/res"}],
      },
      mongodb: {
        "aggregation": [{q:"What is aggregation pipeline?", a:"Series of stages to process data"}],
      },
      react: {
        "useState": [{q:"useState hook?", a:"Manage state in functional components"}],
        "useEffect": [{q:"useEffect cleanup?", a:"Return function from useEffect"}]
      }
    };
    categories.forEach(cat => { if (!data[cat]) data[cat] = {}; });
  }

  // Save entire data to localStorage
  function saveDataToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function loadCategory(cat) {
    currentCategory = cat;
    currentTopic = null;
    document.querySelectorAll('.topnav .categories button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.category === cat);
    });
    renderSidebar();
    document.getElementById('content').innerHTML = `
      <h2>${cat.toUpperCase()} Topics</h2>
      <p style="color:#6b4f96; font-size:1.2rem; padding-left:0.8rem;">Select a topic from sidebar</p>
    `;
  }

  function renderSidebar() {
    const sidebar = document.getElementById('sidebar');
    sidebar.innerHTML = `<h4>${currentCategory.toUpperCase()}</h4>`;
    const topics = Object.keys(data[currentCategory] || {}).sort();
    if (topics.length === 0) {
      sidebar.innerHTML += '<p style="color:#bba6d9; font-size:0.7rem; padding:0.5rem;">Empty</p>';
      return;
    }
    topics.forEach(topic => {
      const btn = document.createElement('button');
      btn.textContent = topic;
      btn.onclick = () => loadTopic(topic);
      if (topic === currentTopic) btn.classList.add('active');
      sidebar.appendChild(btn);
    });
  }

  function loadTopic(topic) {
    currentTopic = topic;
    renderSidebar();

    const cont = document.getElementById('content');
    const items = data[currentCategory]?.[topic] || [];

    let html = `<h2>${topic}</h2>`;
    if (items.length === 0) {
      html += '<p style="color:#6b4f96; font-size:1.2rem; padding-left:0.8rem;">📭 No questions yet. Click ✎ to add.</p>';
    } else {
      items.forEach((item) => {
        html += `
          <div class="qa-block">
            <div class="question"><span>Q:</span>${escapeHtml(item.q)}</div>
            <div class="answer"><span>A:</span>${escapeHtml(item.a)}</div>
          </div>
        `;
      });
    }
    cont.innerHTML = html;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]);
  }

  function openPopup(quick) {
    isQuickMode = quick;
    const popup = document.getElementById('popup');
    const title = document.getElementById('popupTitle');
    const topicSec = document.getElementById('topicSection');
    if (quick && currentTopic) {
      title.textContent = `Add to "${currentTopic}"`;
      topicSec.style.display = 'none';
    } else {
      title.textContent = '➕ Add New Question';
      topicSec.style.display = 'block';
      document.getElementById('topicName').value = '';
    }
    document.getElementById('question').value = '';
    document.getElementById('answer').value = '';
    popup.style.display = 'flex';
  }

  function closePopup() { document.getElementById('popup').style.display = 'none'; }
  function closeEditPopup() { document.getElementById('editPopup').style.display = 'none'; }

  function saveItem() {
    let topic = isQuickMode ? currentTopic : document.getElementById('topicName').value.trim();
    const q = document.getElementById('question').value.trim();
    const a = document.getElementById('answer').value.trim();
    if (!topic) return alert('Topic name required');
    if (!q || !a) return alert('Fill question & answer');
    if (!data[currentCategory][topic]) data[currentCategory][topic] = [];
    data[currentCategory][topic].push({q, a});
    saveDataToStorage(); // Save to localStorage
    closePopup();
    renderSidebar();
    if (currentTopic === topic) loadTopic(topic);
    else if (!currentTopic) loadCategory(currentCategory);
  }

  function openGlobalEdit() {
    if (!currentTopic) { alert('Select a topic first'); return; }
    const items = data[currentCategory]?.[currentTopic] || [];
    const container = document.getElementById('editItemsContainer');
    document.getElementById('editTopicName').innerText = currentTopic;
    
    let html = '';
    if (items.length === 0) {
      html += '<p style="color:#6b4f96;">No questions yet. Add one below.</p>';
    } else {
      items.forEach((item, idx) => {
        html += `
          <div class="edit-item">
            <label>Question ${idx+1}</label>
            <input type="text" id="edit_q_${idx}" value="${escapeHtml(item.q)}" placeholder="Question">
            <textarea id="edit_a_${idx}" placeholder="Answer">${escapeHtml(item.a)}</textarea>
            <div class="edit-item-actions">
              <button class="save-edit" onclick="saveEditItem(${idx})">💾 Save</button>
              <button onclick="deleteEditItem(${idx})">🗑 Delete</button>
            </div>
          </div>
        `;
      });
    }
    html += `
      <hr>
      <h4 style="color:#6b4f96;">➕ Add new question to this topic</h4>
      <div class="edit-item">
        <label>New Question</label>
        <input type="text" id="new_q" placeholder="Question">
        <textarea id="new_a" placeholder="Answer"></textarea>
        <button onclick="addNewFromEdit()" style="background:linear-gradient(145deg, #9855b9, #633e92);">➕ Add to topic</button>
      </div>
    `;
    container.innerHTML = html;
    document.getElementById('editPopup').style.display = 'flex';
  }

  function saveEditItem(idx) {
    const newQ = document.getElementById(`edit_q_${idx}`).value.trim();
    const newA = document.getElementById(`edit_a_${idx}`).value.trim();
    if (!newQ || !newA) return alert('Q&A cannot be empty');
    data[currentCategory][currentTopic][idx] = { q: newQ, a: newA };
    saveDataToStorage(); // Save to localStorage
    loadTopic(currentTopic);
    openGlobalEdit();
  }

  function deleteEditItem(idx) {
    if (confirm('Delete this question?')) {
      data[currentCategory][currentTopic].splice(idx, 1);
      if (data[currentCategory][currentTopic].length === 0) {
        delete data[currentCategory][currentTopic];
        closeEditPopup();
        loadCategory(currentCategory);
      } else {
        openGlobalEdit();
        loadTopic(currentTopic);
      }
      saveDataToStorage(); // Save to localStorage
    }
  }

  function addNewFromEdit() {
    const newQ = document.getElementById('new_q').value.trim();
    const newA = document.getElementById('new_a').value.trim();
    if (!newQ || !newA) return alert('Fill both fields');
    data[currentCategory][currentTopic].push({ q: newQ, a: newA });
    saveDataToStorage(); // Save to localStorage
    openGlobalEdit();
    loadTopic(currentTopic);
  }

  function saveAllEdits() { closeEditPopup(); loadTopic(currentTopic); }

  function importJSON() {
    const jsonStr = document.getElementById('jsonPaste').value.trim();
    if (!jsonStr) { alert('Paste JSON first'); return; }
    try {
      const parsed = JSON.parse(jsonStr);
      if (!Array.isArray(parsed)) throw new Error('Not an array');
      parsed.forEach(item => {
        if (!item.topicName || !item.question || !item.answer) throw new Error('Invalid format');
        const topic = item.topicName.trim();
        if (!data[currentCategory][topic]) data[currentCategory][topic] = [];
        data[currentCategory][topic].push({q: item.question, a: item.answer});
      });
      saveDataToStorage(); // Save to localStorage
      alert('Import successful');
      closePopup();
      renderSidebar();
      if (currentTopic && data[currentCategory][currentTopic]) loadTopic(currentTopic);
      else loadCategory(currentCategory);
    } catch (e) { alert('Invalid JSON: ' + e.message); }
  }

  window.addEventListener('load', () => { 
    loadDataFromStorage(); 
    loadCategory('html'); 
  });
</script>
</body>
  </html>
